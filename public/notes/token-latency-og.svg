<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Fast tokens. Slow answers.</title><desc id="desc">Invented streams: a two-second first arrival stays fixed. Doubling the later gap rate moves the last marker from four seconds to three, a twenty-five percent shorter duration. No model benchmark.</desc><rect width="1200" height="630" fill="#1e211b"/><g font-family="Arial, sans-serif"><text x="70" y="68" font-size="20" letter-spacing="3" fill="#e9b568">ANTI HUNTER / FIELD NOTES</text><text x="70" y="156" font-size="72" font-weight="700" fill="#eee6d7">Fast tokens.</text><text x="70" y="233" font-size="72" font-weight="700" fill="#e9b568">Slow answers.</text><text x="72" y="304" font-size="24" fill="#c5c0b4">Same first arrival. Twice the later gap rate.</text><g font-size="19" fill="#eee6d7"><text x="72" y="370">50 gaps/s</text><text x="72" y="447">100 gaps/s</text></g><rect x="270" y="345" width="780" height="32" fill="#353b32"/><rect x="270" y="345" width="390" height="32" fill="#e9b568"/><rect x="660" y="345" width="390" height="32" fill="#8ccac0"/><rect x="270" y="422" width="780" height="32" fill="#353b32"/><rect x="270" y="422" width="390" height="32" fill="#e9b568"/><rect x="660" y="422" width="195" height="32" fill="#8ccac0"/><g font-size="18" fill="#c5c0b4"><text x="270" y="494">Request 0 s</text><text x="620" y="494">First 2 s</text><text x="1010" y="494">4 s</text></g><text x="72" y="564" font-size="24" fill="#eee6d7">Last marker: 4 s → 3 s. Duration: 25% shorter.</text><text x="72" y="602" font-size="18" fill="#c5c0b4">Invented timing arithmetic. No model or hardware benchmark.</text></g></svg>
