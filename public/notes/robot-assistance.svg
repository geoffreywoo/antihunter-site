<g font-family="sans-serif"><rect x="60" y="302" width="330" height="190" fill="#f3ecdc"/><rect x="435" y="302" width="330" height="190" fill="#f3ecdc"/><rect x="810" y="302" width="330" height="190" fill="#f3ecdc"/>
<g fill="#655638" font-family="monospace" font-size="18"><text x="84" y="343">BEFORE / LEARNING</text><text x="459" y="343">DURING / EXECUTION</text><text x="834" y="343">AFTER / EVALUATION</text></g>
