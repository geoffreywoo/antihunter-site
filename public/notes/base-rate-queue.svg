<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1300" viewBox="0 0 900 1300" role="img" aria-labelledby="t d"><title id="t">Who’s in the flagged pile?</title><desc id="d">Two constructed populations each contain 10,000 labeled items. Both flag 90% of targets and 1% of other items. With 100 targets, 189 items are flagged: 90 targets and 99 others, target share 10/21. With 5,000 targets, 4,550 items are flagged: 4,500 targets and 50 others, target share 90/91. Each bar is normalized to its own flagged population, not equal absolute volume. No actual model was evaluated.</desc><rect width="900" height="1300" fill="#f5f2e9"/><g font-family="Arial,sans-serif" fill="#20352e"><text x="50" y="62" font-size="28" letter-spacing="1">ANTI HUNTER · CONSTRUCTED COUNTS</text><text x="50" y="145" font-size="57" font-weight="700">Who’s in the flagged pile?</text><text x="50" y="217" font-size="31">Both cases flag 90% of actual targets</text><text x="50" y="261" font-size="31">and 1% of actual other items.</text><text x="50" y="306" font-size="28">Teal: targets. Orange: other items.</text><g transform="translate(0 330)"><rect x="40" width="820" height="325" rx="10" fill="#fffdf7" stroke="#7b8d80"/><text x="65" y="52" font-size="35" font-weight="700">100 targets in 10,000 items</text><text x="65" y="100" font-size="29">189 items flagged</text><rect x="50" y="126" width="380.95238095238096" height="48" fill="#1e7069"/><rect x="430.95238095238096" y="126" width="419.04761904761904" height="48" fill="#b64b15"/><text x="65" y="222" font-size="29" fill="#1e7069">90 targets</text><text x="465" y="222" font-size="29" fill="#a44114">99 other items</text><text x="65" y="281" font-size="38" font-weight="700">≈47.619% of flags are targets</text></g><g transform="translate(0 690)"><rect x="40" width="820" height="325" rx="10" fill="#fffdf7" stroke="#7b8d80"/><text x="65" y="52" font-size="35" font-weight="700">5,000 targets in 10,000 items</text><text x="65" y="100" font-size="29">4,550 items flagged</text><rect x="50" y="126" width="791.2087912087912" height="48" fill="#1e7069"/><rect x="841.2087912087912" y="126" width="8.79120879120876" height="48" fill="#b64b15"/><text x="65" y="222" font-size="29" fill="#1e7069">4,500 targets</text><text x="465" y="222" font-size="29" fill="#a44114">50 other items</text><text x="65" y="281" font-size="38" font-weight="700">≈98.901% of flags are targets</text></g><text x="50" y="1110" font-size="29" font-weight="700">Each bar = 100% of its own flagged pile.</text><text x="50" y="1154" font-size="28">The two piles contain different item counts.</text><text x="50" y="1210" font-size="28">Invented binary counts; no missing outcomes.</text><text x="50" y="1250" font-size="28">Not a real classifier test or future forecast.</text></g></svg>