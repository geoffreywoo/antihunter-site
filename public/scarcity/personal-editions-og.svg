<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Personal Editions — Life After Scarcity</title>
<desc>Original fiction. A book-club reader asks who killed the detective. Another reader's personalized edition ends in the detective's marriage to the butler. Anti Hunter hears both versions.</desc>
