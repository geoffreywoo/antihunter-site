<g fill="#172d32" font-family="Arial,sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="35" y="62" font-size="52" font-weight="bold">PERSONAL EDITIONS</text>
<text x="37" y="105" font-size="29">One book club. Personalized plots.</text>
<rect x="24" y="124" width="1152" height="449" rx="18" fill="#d9e9e4" stroke="#172d32" stroke-width="4"/>
<path d="M28 501H1172V568H28Z" fill="#c1cfbf"/>
<rect x="52" y="144" width="405" height="110" rx="14" fill="#fff9eb" stroke="#172d32" stroke-width="3"/>
<text x="77" y="188" font-size="38">Who killed</text>
<text x="77" y="235" font-size="38">the detective?</text>
<path d="M250 254V275" stroke="#172d32" stroke-width="3"/>
<rect x="731" y="144" width="411" height="142" rx="14" fill="#fff9eb" stroke="#172d32" stroke-width="3"/>
<text x="754" y="185" font-size="36">Nobody.</text>
<text x="754" y="228" font-size="36">She marries</text>
<text x="754" y="271" font-size="36">the butler.</text>
