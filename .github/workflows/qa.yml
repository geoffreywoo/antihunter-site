name: QA

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly at 03:17 UTC (~10:17pm ET / 11:17pm EDT)
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test calculator and growth controls
        run: npm test

      - name: Validate treasury snapshot schema + guardrails
        run: npm run treasury:validate

      - name: Start compiled site for link checks
        run: |
          node scripts/serve-built-site.mjs > /tmp/antihunter-link-preview.log 2>&1 &
          echo $! > /tmp/antihunter-link-preview.pid
          curl --retry 10 --retry-connrefused --retry-delay 1 --max-time 5 --fail --silent http://127.0.0.1:4328/ > /dev/null

      - name: Link check (compiled site)
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          # Resolve site URLs against this build, including the real SSR handler.
          # Keep the existing external authentication/rate-limit policy.
          args: >-
            --no-progress
            --verbose
            --accept=200,204,206,301,302,303,307,308,403,429
            --retry-wait-time 2
            --max-retries 2
            --timeout 20
            --base-url http://127.0.0.1:4328
            --remap 'https://(www\.)?antihunter\.com(.*) http://127.0.0.1:4328$2'
            --exclude 'https://(www\.)?twitter\.com/.*'
            --exclude 'https://(www\.)?x\.com/.*'
            --exclude 'https://discord\.gg/.*'
            '.vercel/output/static/**/*.html'
          fail: true

      - name: Stop compiled site
        if: always()
        run: |
          if [ -f /tmp/antihunter-link-preview.pid ]; then
            kill "$(cat /tmp/antihunter-link-preview.pid)" || true
          fi
